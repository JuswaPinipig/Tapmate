<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TapMate</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css?v=5">
</head>

<body>

    <!-- Background video: silent, looping, no controls -->
    <video class="bg-video" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true">
        <source src="../LOGIN/assets/school-video.mp4" type="video/mp4">
    </video>

    <!-- Warm maroon layer over the video -->
    <div class="bg-overlay"></div>

    <main class="panel">
        <h1 class="brand">
            <img src="../LOGIN/assets/tapmate logo.png" alt="TapMate" draggable="false">
        </h1>
        <p id="sub" class="sub">Tap your ID card on the reader.</p>

        <div id="swipe" class="swipe">
            <div id="track" class="track">

                <!-- Pane 1: RFID -->
                <section id="paneRfid" class="pane" aria-label="RFID login">
                    <div id="tap" class="tap waiting" aria-hidden="true">
                        <!-- RFID wave logo -->
                        <img src="../LOGIN/assets/RFID%20wave.png" alt="" draggable="false">
                    </div>

                    <!-- PIN (typed on the keyboard; shown after a valid card is tapped) -->
                    <div id="pinArea" class="pin-area" hidden>
                        <p class="pin-prompt">Please enter your PIN.</p>
                        <div id="pinDots" class="pin-dots" role="img" aria-label="0 digits entered"></div>
                    </div>
                </section>

                <!-- Pane 2: Manual login -->
                <section id="paneManual" class="pane" aria-label="Manual login" inert>
                    <!-- School email + RFID number, then the PIN -->
                    <form id="emailArea" class="email-area" novalidate autocomplete="off">
                        <div class="field">
                            <input id="emailInput" name="school-email" type="email" placeholder=" " inputmode="email"
                                autocomplete="off" autocapitalize="off" spellcheck="false">
                            <label for="emailInput">School email</label>
                        </div>
                        <div class="field">
                            <input id="rfidInput" name="rfid-number" type="password" placeholder=" " autocomplete="off"
                                spellcheck="false">
                            <label for="rfidInput">RFID number</label>
                        </div>
                        <button id="emailBtn" class="btn" type="submit">CONTINUE</button>
                        <button id="parentLink" class="alt-link" type="button">LOGIN AS PARENT</button>
                    </form>

                    <!-- Parent: email + password first; the PIN screen opens after they check out -->
                    <form id="parentArea" class="email-area" hidden novalidate autocomplete="off">
                        <div class="field">
                            <input id="parentContact" name="parent-email" type="email" placeholder=" " inputmode="email"
                                autocomplete="username" autocapitalize="off" spellcheck="false">
                            <label for="parentContact">Email</label>
                        </div>
                        <div class="field">
                            <input id="parentPw" name="parent-password" type="password" placeholder=" "
                                autocomplete="current-password" spellcheck="false">
                            <label for="parentPw">Password</label>
                        </div>
                        <button id="parentBtn" class="btn" type="submit">CONTINUE</button>
                        <button id="studentLink" class="alt-link" type="button">LOGIN WITH SCHOOL EMAIL</button>
                    </form>
                </section>

            </div>
        </div>

        <div id="status" class="status">
            <div class="status-inner">
                <div class="status-content">
                    <p id="message" role="status" aria-live="polite"></p>
                    <p id="detail"></p>
                    <!-- Shown when a card can't be used (not assigned, inactive, no PIN, locked, offline) -->
                    <p id="notice" class="notice" role="alert" hidden></p>
                </div>
            </div>
        </div>

        <!-- Page dots: tap one, or swipe the panel -->
        <div id="tabs" class="dots" role="tablist" aria-label="Login method">
            <button id="tabRfid" class="dot-btn" type="button" role="tab" aria-selected="true"
                aria-label="RFID login"></button>
            <button id="tabManual" class="dot-btn" type="button" role="tab" aria-selected="false"
                aria-label="Manual login"></button>
        </div>
    </main>

    <!-- Supabase client (loads as global `supabase`) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js?v=5"></script>
</body>

</html>
